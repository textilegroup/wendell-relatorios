<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendas Wendell Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
:root{
  --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
  --bg:#F2F2F0; --card:#FFFFFF; --sunk:#F7F5F3;
  --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
  --line:#E3E0DD; --line-2:#EFECE9;
  --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8;
  --pos:#2C6B4F; --neg:#A33A2A;
  --chip:#F6F4F1;
  --shadow:0 1px 2px rgba(38,37,42,.06),0 1px 8px rgba(38,37,42,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
    --bg:#141316; --card:#1E1C21; --sunk:#26232A;
    --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
    --line:#332F38; --line-2:#2A272F;
    --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0;
    --pos:#5FA37E; --neg:#D97A62;
    --chip:#2A272F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
  --bg:#141316; --card:#1E1C21; --sunk:#26232A;
  --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
  --line:#332F38; --line-2:#2A272F;
  --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0;
  --pos:#5FA37E; --neg:#D97A62;
  --chip:#2A272F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}

/* ---------- gate ---------- */
#gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:linear-gradient(150deg,var(--wine-deep) 0%,var(--wine) 55%,#3C0812 100%);
}
.gate-box{
  background:var(--card);border-radius:14px;padding:26px 24px 20px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.32);text-align:center;
}
.gate-box .logo{margin:0 auto 12px;background:var(--wine);color:#fff;border-color:var(--wine-soft)}
.gate-box h2{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.gate-box p{margin:0 0 16px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.gate-box input{
  width:100%;font:inherit;font-size:14px;text-align:center;letter-spacing:.12em;
  padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);
}
.gate-box button{
  width:100%;margin-top:9px;font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:10px;border:0;border-radius:9px;background:var(--wine);color:#fff;cursor:pointer;
}
.gate-box button:hover{background:var(--wine-soft)}
.gate-err{margin-top:9px;font-size:11.5px;color:var(--neg);font-weight:600;min-height:16px}
#app[hidden]{display:none}

/* ---------- header ---------- */
header{
  background:linear-gradient(100deg,var(--wine-deep) 0%,var(--wine) 62%,var(--wine-deep) 100%);
  color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
.logo{
  width:38px;height:38px;border-radius:50%;background:#fff;color:var(--wine-deep);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;
  border:2px solid rgba(255,255,255,.85);flex:none;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11px;opacity:.78;letter-spacing:.02em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-chip{
  border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 10px;
  font-size:11.5px;font-weight:600;letter-spacing:.03em;background:rgba(255,255,255,.07);
  color:#fff;cursor:pointer;
}
.hdr-chip:hover{background:rgba(255,255,255,.16)}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang button{
  font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:5px 10px;
  border:0;background:transparent;color:rgba(255,255,255,.72);cursor:pointer;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--wine-deep)}

/* ---------- shell ---------- */
main{max-width:1500px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:10px;padding:9px 14px 8px;border-bottom:2px solid var(--wine-soft)}
.card-hd h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--wine)}
.card-hd .sub{margin-left:auto;font-size:11px;color:var(--ink-3);letter-spacing:.02em;text-align:right}
.card-bd{padding:11px 14px 13px}

/* ---------- filters ---------- */
.frow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrp>label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pills{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.pills button{
  font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--ink-2);
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.pills button[aria-pressed="true"]{background:var(--wine);color:#fff}
.pills button:focus-visible,select:focus-visible,input:focus-visible,.hdr-chip:focus-visible,
.lang button:focus-visible,th[data-sort]:focus-visible{outline:2px solid var(--wine-soft);outline-offset:2px}
select,input[type="search"]{
  font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:150px;
}
input[type="search"]{min-width:210px}
.grow{flex:1 1 210px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:11px 13px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kpi .val{font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-size:26px;font-weight:700;
  letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.kpi .val small{font-size:15px;font-weight:600;color:var(--ink-2);margin-right:.22em}
.kpi .meta{font-size:11px;color:var(--ink-2);margin-top:2px}
.delta{font-weight:700}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:5px}
.spark i{flex:1;background:var(--s1);opacity:.35;border-radius:2px 2px 0 0;min-height:2px}
.spark i.on{opacity:1}
.spark.c2 i{background:var(--s2)}

/* ---------- charts ---------- */
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;align-items:start}
.stackcol{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-2);
  margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(255,255,255,.8) 2px 4px)}

.bars{display:flex;align-items:flex-end;gap:6px;height:176px;position:relative}
.bars.short{height:150px}
.grid-lines{position:absolute;inset:16px 0 24px;pointer-events:none}
.grid-lines div{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.stack{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bar{background:var(--s1);border-radius:4px 4px 0 0;min-height:2px;transition:filter .12s}
.bar.b2{background:var(--s2)}
.bar.b3{background:var(--s3)}
.bar.b3.negv{background:var(--neg)}
.bar.part{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.45) 4px 8px)}
.mcol:hover .bar{filter:brightness(1.12)}
.mcol.cur .bar{outline:2px solid var(--wine-soft);outline-offset:1px}
.mlab{text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);padding-top:5px;
  border-top:1px solid var(--line);margin-top:4px;letter-spacing:.04em}
.mval{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-2);
  font-family:"Archivo Narrow",Archivo,sans-serif;padding-bottom:3px;min-height:14px}
.mval.na{color:var(--ink-3);font-weight:400}

.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:9px;font-size:12px}
.hb .uf{font-weight:700;letter-spacing:.04em;color:var(--ink)}
.hb .track{display:block;background:var(--sunk);border-radius:4px;height:15px;overflow:hidden}
.hb .fill{display:block;height:100%;background:var(--s1);border-radius:4px}
.hb .amt{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:600;color:var(--ink-2);white-space:nowrap}
.hint{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.45}
code{font-size:.94em;background:var(--sunk);padding:1px 4px;border-radius:4px}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--sunk);color:var(--ink-2);
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead th:first-child{text-align:left;left:0;z-index:5;background:var(--sunk)}
thead th.cart{color:var(--s2)}
thead th.cur{color:var(--wine)}
thead th[aria-sort="desc"]::after{content:" ▾";font-size:9px}
thead th[aria-sort="asc"]::after{content:" ▴";font-size:9px}
tbody td{
  padding:4px 8px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-weight:500;
}
tbody td.cli{
  text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  font-family:"Archivo",Arial,sans-serif;font-weight:500;max-width:250px;overflow:hidden;
  text-overflow:ellipsis;border-right:1px solid var(--line);
}
tbody td.cli.novo{box-shadow:inset 3px 0 0 var(--pos);padding-left:11px}
tbody tr:hover td,tbody tr:hover td.cli{background:var(--sunk)}
td.zero{color:var(--ink-3);font-weight:400}
td.cart{color:var(--s2);font-weight:700;background:color-mix(in srgb,var(--s2) 8%,transparent)}
tbody tr:hover td.cart{background:color-mix(in srgb,var(--s2) 14%,transparent)}
td.cart.zero{color:var(--ink-3);font-weight:400;background:none}
td.cur{font-weight:700;color:var(--ink)}
td.tot{font-weight:700;border-left:1px solid var(--line)}
tfoot td{
  padding:7px 8px;text-align:right;font-weight:700;font-family:"Archivo Narrow",Archivo,sans-serif;
  border-top:2px solid var(--wine-soft);background:var(--sunk);white-space:nowrap;
}
tfoot td:first-child{
  text-align:left;position:sticky;left:0;background:var(--sunk);font-family:Archivo,Arial,sans-serif;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);
}
.tag{
  display:inline-block;font-family:Archivo,sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;
  background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos);
}
.newlist{display:flex;flex-wrap:wrap;gap:6px}
.newlist span{font-size:11px;background:var(--chip);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;color:var(--ink-2)}

#tip{
  position:fixed;pointer-events:none;z-index:90;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:240px;
}
#tip b{font-family:"Archivo Narrow",Archivo,sans-serif}
#tip .k{color:var(--ink-3);font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:block}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
footer{font-size:10.5px;color:var(--ink-3);text-align:center;padding:2px 0 0;line-height:1.6}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  body{font-size:12.5px}
  main{padding:10px 10px 30px;gap:10px}
  .brand h1{font-size:16px}
  .logo{width:32px;height:32px;font-size:11px}
  .kpi .val{font-size:22px}
  .card-bd{padding:10px 11px 12px}
  .frow{gap:10px 12px}
  select,input[type="search"]{min-width:0;width:100%}
  .fgrp{flex:1 1 46%}
  .fgrp.grow,.fgrp:has(.pills){flex:1 1 100%}
  .pills{width:100%}
  .pills button{flex:1;padding:6px 6px;font-size:11.5px}
  tbody td.cli{max-width:132px;font-size:11px}
  .bars{height:132px}.bars.short{height:120px}
  .mval{font-size:9px}.mlab{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div id="gate">
  <form class="gate-box" id="gateForm">
    <div class="logo">WGI</div>
    <h2 id="gTitle">Relatório de Vendas</h2>
    <p id="gSub"></p>
    <input type="password" id="gPass" autocomplete="current-password">
    <button type="submit" id="gBtn">Entrar</button>
    <div class="gate-err" id="gErr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
<header>
  <div class="logo">WGI</div>
  <div class="brand"><h1 id="hTitle"></h1><p id="hSub"></p></div>
  <div class="hdr-right">
    <div class="lang" id="fLang">
      <button type="button" data-v="pt">PT</button>
      <button type="button" data-v="en">EN</button>
    </div>
    <span class="hdr-chip" id="period"></span>
    <button class="hdr-chip" id="themeBtn" type="button"></button>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-hd"><h2 id="lFilters"></h2><span class="sub" id="fcount"></span></div>
    <div class="card-bd">
      <div class="frow">
        <div class="fgrp"><label for="fRep" id="lRep"></label><select id="fRep"></select></div>
        <div class="fgrp"><label for="fUf" id="lState"></label><select id="fUf"></select></div>
        <div class="fgrp"><label id="lGeo"></label>
          <div class="pills" id="fGeo">
            <button type="button" data-v="wh" id="lGeoWh"></button>
            <button type="button" data-v="uf" id="lGeoUf"></button>
          </div>
        </div>
        <div class="fgrp"><label id="lCur"></label>
          <div class="pills" id="fCur">
            <button type="button" data-v="BRL">R$</button>
            <button type="button" data-v="USD">US$</button>
          </div>
        </div>
        <div class="fgrp grow"><label for="fQ" id="lSearch"></label><input type="search" id="fQ"></div>
      </div>
    </div>
  </section>

  <section class="kpis">
    <div class="kpi"><span class="lab" id="lK1"></span><span class="val" id="kTot"></span>
      <span class="meta" id="kTotMeta"></span><div class="spark" id="kSpark"></div></div>
    <div class="kpi"><span class="lab" id="lK2"></span><span class="val" id="kUf"></span>
      <span class="meta" id="kUfMeta"></span><div class="spark" id="kUfSpark"></div></div>
    <div class="kpi"><span class="lab" id="lK3"></span><span class="val" id="kAvg"></span>
      <span class="meta" id="kAvgMeta"></span><div class="spark" id="kAvgSpark"></div></div>
    <div class="kpi"><span class="lab" id="lK4"></span><span class="val" id="kNew"></span>
      <span class="meta" id="kNewMeta"></span><div class="spark" id="kNewSpark"></div></div>
    <div class="kpi"><span class="lab" id="lK5"></span><span class="val" id="kCom"></span>
      <span class="meta" id="kComMeta"></span><div class="spark c2" id="kComSpark"></div></div>
  </section>

  <section class="two">
    <div class="stackcol">
      <div class="card">
        <div class="card-hd"><h2 id="lChart1"></h2>
          <span class="legend">
            <span><i style="background:var(--s1)"></i><b id="lLegInv"></b></span>
            <span><i style="background:var(--s2)"></i><b id="lLegBack"></b></span>
          </span>
        </div>
        <div class="card-bd"><div class="bars" id="chart"><div class="grid-lines" id="glines"></div></div></div>
      </div>
      <div class="card">
        <div class="card-hd"><h2 id="lChart2"></h2>
          <span class="legend">
            <span><i style="background:var(--s3)"></i><b id="lLegMg"></b></span>
            <span><i class="hatch" style="background-color:var(--s3)"></i><b id="lLegPart"></b></span>
          </span>
        </div>
        <div class="card-bd">
          <div class="bars short" id="chartM"><div class="grid-lines" id="glinesM"></div></div>
          <p class="hint" id="mgHint"></p>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><h2 id="lChart3"></h2><span class="sub" id="geoLab"></span></div>
      <div class="card-bd"><div class="hbars" id="ufbars"></div><p class="hint" id="ufHint"></p></div>
    </div>
  </section>

  <section class="card">
    <div class="card-hd"><h2 id="lTable"></h2><span class="sub" id="tcount"></span></div>
    <div class="tscroll">
      <table><thead><tr id="thr"></tr></thead><tbody id="tb"></tbody><tfoot><tr id="tf"></tr></tfoot></table>
    </div>
  </section>

  <section class="card">
    <div class="card-hd"><h2 id="lNew"></h2><span class="sub" id="newSub"></span></div>
    <div class="card-bd"><div class="newlist" id="newList"></div></div>
  </section>

  <footer id="foot"></footer>
</main>
<div id="tip" role="status" aria-live="polite"></div>
</div>

  hintUfOk:'UF informada no mapa <code>UF_CLIENTE</code> no topo do script. Clientes sem UF aparecem como “—”.',
  hintUfEmpty:'⚠ O mapa <code>UF_CLIENTE</code> ainda está vazio — preencha a sigla de cada cliente no topo do script para usar esta visão.',
  mgHint:c=>'Margem ponderada pelo valor de venda. A planilha só informa margem em '+c+'% do faturamento — barras hachuradas marcam meses com cobertura abaixo de 60%.',
  tipInv:'faturado', tipBack:'em carteira', tipMg:'margem ponderada',
  tipCov:'cobertura', tipNoMg:'sem margem informada',
  foot:'Fonte: SALES REPORT — WENDELL BRAZIL (aba BASE), '+DATA.rows.length+' linhas de item · câmbio fixo R$ 5,10/US$ (aba FX Rates).<br>Faturamento = soma do valor por item das linhas <b>Invoiced</b>. Carteira = linhas <b>TBI</b> (a faturar). Comissão e margem ponderadas pelo valor de venda.'
 },
 en:{
  htitle:'Sales Report', hsub:'Wendell Global Interlining · Brazil',
  gsub:'Wendell Global Interlining · restricted access', gpass:'Password', gbtn:'Enter',
  gerr:'Wrong password.', theme:'Theme',
  filters:'Filters', rep:'Sales rep', all:'All', state:'State',
  geo:'Geographic basis', geoWh:'Warehouse', geoUf:'Customer state', cur:'Currency',
  search:'Search customer', searchPh:'e.g. CONFECCOES, LUPO, TUTTO…',
  k1:'Total Revenue', k2:'Revenue by State', k3:'Annual Average Revenue',
  k4:'New Customers', k5:'Weighted Average Commission',
  chart1:'Monthly revenue', chart2:'Monthly margin', chart3:'By state',
  legInv:'Invoiced', legBack:'Backlog (to invoice)', legMg:'Weighted margin',
  legPart:'Partial coverage',
  table:'Sales by customer', tCli:'Customer', tCart:'Backlog', tTot:'YTD total',
  tTotal:'Total', newTitle:'New customers', newTag:'new',
  lines:(a,b)=>a+' invoiced lines · '+b+' in backlog',
  vs:(m,p,v)=>m+' vs '+p+' · '+v,
  share:(v,p,n)=>v+' · '+p+'% of total · '+n+' '+(n>1?'states':'state'),
  avgMeta:(n,p)=>'avg/month over '+n+' months · 12m projection '+p,
  newMeta:(m,n)=>'in '+m+' · '+n+' active customers YTD',
  comMeta:(v,n)=>v+' in commissions · '+n+' orders with commission',
  tcount:(n,c)=>n+' customers · values in '+c+' · ● current month',
  newSub:n=>n+' customers YTD',
  noData:'No data for the current filters.',
  noRows:'No customers match the selected filters.',
  noNew:'No new customers in the filtered period.',
  geoLabWh:'Origin warehouse', geoLabUf:'Customer state',
  hintWh:'The workbook has no customer state; this view uses the origin warehouse (WH column). For revenue by actual state, fill in <code>UF_CLIENTE</code> in the script.',
  hintUfOk:'States taken from the <code>UF_CLIENTE</code> map at the top of the script. Customers with no state show as “—”.',
  hintUfEmpty:'⚠ The <code>UF_CLIENTE</code> map is still empty — fill in each customer’s state code at the top of the script to use this view.',
  mgHint:c=>'Margin weighted by sales value. The workbook reports margin on only '+c+'% of revenue — hatched bars mark months with coverage below 60%.',
  tipInv:'invoiced', tipBack:'in backlog', tipMg:'weighted margin',
  tipCov:'coverage', tipNoMg:'no margin reported',
  foot:'Source: SALES REPORT — WENDELL BRAZIL (BASE sheet), '+DATA.rows.length+' item lines · fixed rate BRL 5.10/USD (FX Rates sheet).<br>Revenue = sum of item value on <b>Invoiced</b> lines. Backlog = <b>TBI</b> lines (to invoice). Commission and margin weighted by sales value.'
 }
};

const S = {rep:'', uf:'', geo:'wh', cur:'BRL', q:'', sort:'tot', dir:-1, lang:'pt'};
const t = () => T[S.lang];
const mn = m => S.lang==='en' ? MES_EN[m] : m;
const loc = () => S.lang==='en' ? 'en-US' : 'pt-BR';

const conv = v => S.cur==='BRL' ? v : v/FX;
const sym  = () => S.cur==='BRL' ? 'R$' : 'US$';
const nf0 = v => new Intl.NumberFormat(loc(),{maximumFractionDigits:0}).format(v);
const nf1 = v => new Intl.NumberFormat(loc(),{minimumFractionDigits:1,maximumFractionDigits:1}).format(v);
const money = v => sym()+' '+nf0(conv(v));
function compact(v){
  const x = conv(v), MI = S.lang==='en' ? 'M' : ' mi', K = S.lang==='en' ? 'k' : ' mil';
  if (Math.abs(x) >= 1e6) return nf1(x/1e6)+MI;
  if (Math.abs(x) >= 1e3) return nf0(Math.round(x/1e3))+K;
  return nf0(x);
}
const pct = v => nf1(v)+'%';
const ufOf = r => S.geo==='uf' ? (UF_CLIENTE[r.cli] || '—') : r.wh;
const hasUf = () => Object.values(UF_CLIENTE).some(v => v && v.trim());

const FIRST = {};
R.filter(r=>r.st==='I').forEach(r=>{
  const i = M.indexOf(r.mes);
  if (FIRST[r.cli]===undefined || i < FIRST[r.cli]) FIRST[r.cli] = i;
});

const filtered = () => {
  const q = S.q.trim().toUpperCase();
  return R.filter(r => (!S.rep||r.rep===S.rep) && (!S.uf||ufOf(r)===S.uf) && (!q||r.cli.includes(q)));
};

const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  const b = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - b.height - 10;
  if (x + b.width > innerWidth - 8) x = e.clientX - b.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const hideTip = () => tip.style.opacity = 0;
const el = id => document.getElementById(id);
const set  = (id,v) => { const n = el(id); if (n) n.textContent = v; };
const setH = (id,v) => { const n = el(id); if (n) n.innerHTML = v; };

function applyLang(){
  const L = t();
  document.documentElement.lang = S.lang==='en' ? 'en' : 'pt-BR';
  document.title = S.lang==='en' ? 'Wendell Brazil Sales' : 'Vendas Wendell Brasil';
  set('hTitle',L.htitle); set('hSub',L.hsub); set('themeBtn',L.theme);
  set('gTitle',L.htitle); set('gSub',L.gsub); set('gBtn',L.gbtn);
  const gp = el('gPass');
  if (gp){ gp.placeholder = L.gpass; gp.setAttribute('aria-label',L.gpass); }
  set('lFilters',L.filters); set('lRep',L.rep); set('lState',L.state);
  set('lGeo',L.geo); set('lGeoWh',L.geoWh); set('lGeoUf',L.geoUf);
  set('lCur',L.cur); set('lSearch',L.search);
  el('fQ').placeholder = L.searchPh;
  set('lK1',L.k1); set('lK2',L.k2); set('lK3',L.k3); set('lK4',L.k4); set('lK5',L.k5);
  set('lChart1',L.chart1); set('lChart2',L.chart2); set('lChart3',L.chart3);
  set('lLegInv',L.legInv); set('lLegBack',L.legBack);
  set('lLegMg',L.legMg); set('lLegPart',L.legPart);
  set('lTable',L.table); set('lNew',L.newTitle);
  setH('foot',L.foot);
  set('period', DATA.ano+' · '+mn(M[0])+'–'+mn(M[M.length-1]));
  setH('fRep', '<option value="">'+L.all+'</option>'
    + DATA.reps.map(r=>'<option'+(r===S.rep?' selected':'')+'>'+r+'</option>').join(''));
}

function render(){
  const L = t(), rows = filtered();
  const inv = rows.filter(r=>r.st==='I'), tbi = rows.filter(r=>r.st==='T');

  const byM = {}; M.forEach(m=>byM[m]={v:0, cw:0, mw:0, mb:0});
  inv.forEach(r=>{
    const a = byM[r.mes];
    a.v += r.brl; a.cw += r.brl*r.com;
    if (r.mg !== null){ a.mw += r.brl*r.mg; a.mb += r.brl; }
  });
  const totalInv = inv.reduce((a,r)=>a+r.brl,0);
  const totalTbi = tbi.reduce((a,r)=>a+r.brl,0);
  const active = M.filter(m=>byM[m].v>0);
  const avg = active.length ? totalInv/active.length : 0;
  const iCur = M.indexOf(CUR), prev = M[iCur-1];

  /* 1 — faturamento total */
  const dPct = prev && byM[prev].v ? (byM[CUR].v-byM[prev].v)/byM[prev].v*100 : null;
  setH('kTot','<small>'+sym()+'</small>'+compact(totalInv));
  setH('kTotMeta',
    (dPct===null?'':'<span class="delta '+(dPct>=0?'up':'down')+'">'+(dPct>=0?'▲':'▼')+' '+pct(Math.abs(dPct))+'</span> ')
    + L.vs(mn(CUR), mn(prev), money(byM[CUR].v)));
  spark('kSpark', M.map(m=>byM[m].v), iCur);

  /* 2 — por estado */
  const byU = {};
  inv.forEach(r=>{ const u=ufOf(r); byU[u]=(byU[u]||0)+r.brl; });
  const uList = Object.entries(byU).sort((a,b)=>b[1]-a[1]);
  const top = uList[0];
  set('kUf', top ? top[0] : '—');
  set('kUfMeta', top ? L.share(money(top[1]), nf1(top[1]/totalInv*100), uList.length) : '—');
  spark('kUfSpark', uList.map(u=>u[1]), 0);
  set('geoLab', S.geo==='uf' ? L.geoLabUf : L.geoLabWh);
  const maxU = top ? top[1] : 1;
  setH('ufbars', uList.map(([u,v])=>
    '<div class="hb" data-uf="'+u+'" data-v="'+v+'"><span class="uf">'+u+'</span>'
    +'<span class="track"><span class="fill" style="width:'+Math.max(2,v/maxU*100)+'%"></span></span>'
    +'<span class="amt">'+money(v)+'</span></div>').join('')
    || '<p class="hint">'+L.noData+'</p>');
  setH('ufHint', S.geo==='uf' ? (hasUf()?L.hintUfOk:L.hintUfEmpty) : L.hintWh);

  /* 3 — média */
  setH('kAvg','<small>'+sym()+'</small>'+compact(avg));
  set('kAvgMeta', L.avgMeta(active.length, money(avg*12)));
  spark('kAvgSpark', M.map(m=>byM[m].v), -1);

  /* 4 — clientes novos */
  const clis = [...new Set(inv.map(r=>r.cli))];
  const newByM = {}; M.forEach(m=>newByM[m]=0);
  const novosMes = [];
  clis.forEach(c=>{
    const i = FIRST[c]; if (i===undefined) return;
    newByM[M[i]]++; if (M[i]===CUR) novosMes.push(c);
  });
  set('kNew', novosMes.length);
  set('kNewMeta', L.newMeta(mn(CUR), clis.length));
  spark('kNewSpark', M.map(m=>newByM[m]), iCur);

  /* 5 — comissão média ponderada pelo valor de venda */
  const comW = inv.reduce((a,r)=>a+r.brl*r.com, 0);
  const nPed = new Set(inv.filter(r=>r.com>0).map(r=>r.mes+'|'+r.ped+'|'+r.cli)).size;
  set('kCom', totalInv ? pct(comW/totalInv*100) : '—');
  set('kComMeta', L.comMeta(money(comW), nPed));
  spark('kComSpark', M.map(m=>byM[m].v ? byM[m].cw/byM[m].v*100 : 0), iCur);

  /* gráfico 1 — faturamento */
  const maxBar = Math.max(...M.map(m=>byM[m].v), byM[CUR].v+totalTbi, 1);
  setH('glines',[0,25,50,75].map(p=>'<div style="top:'+p+'%"></div>').join(''));
  drawBars('chart', M.map(m=>{
    const v = byM[m].v, tb = (m===CUR ? totalTbi : 0);
    return {m, label: v?compact(v):'',
      segs: (tb?[{cls:'bar b2', h:tb/maxBar*100}]:[]).concat([{cls:'bar', h:v/maxBar*100}]),
      tip:'<span class="k">'+mn(m)+'/'+DATA.ano+'</span><b>'+money(v)+'</b> '+L.tipInv
        + (tb?'<br><b style="color:var(--s2)">'+money(tb)+'</b> '+L.tipBack:'')};
  }));

  /* gráfico 2 — margem ponderada */
  const mg = M.map(m=>{
    const a = byM[m];
    return {m, p: a.mb ? a.mw/a.mb*100 : null, cov: a.v ? a.mb/a.v*100 : 0};
  });
  const maxMg = Math.max.apply(null, mg.map(x=>Math.abs(x.p||0)).concat([1]));
  setH('glinesM',[0,33,66].map(p=>'<div style="top:'+p+'%"></div>').join(''));
  drawBars('chartM', mg.map(x=>({
    m: x.m,
    label: x.p===null ? '–' : pct(x.p),
    labelCls: x.p===null ? 'na' : '',
    segs: x.p===null ? [{cls:'bar b3', h:0}]
        : [{cls:'bar b3'+(x.p<0?' negv':'')+(x.cov<60?' part':''), h:Math.abs(x.p)/maxMg*100}],
    tip: '<span class="k">'+mn(x.m)+'/'+DATA.ano+'</span>'
       + (x.p===null ? L.tipNoMg
         : '<b>'+pct(x.p)+'</b> '+L.tipMg+'<br>'+L.tipCov+': '+nf0(x.cov)+'% '+L.tipInv)
  })));
  const covTot = totalInv ? M.reduce((a,m)=>a+byM[m].mb,0)/totalInv*100 : 0;
  setH('mgHint', L.mgHint(nf0(covTot)));

  /* tabela */
  const byCli = {};
  rows.forEach(r=>{
    const o = byCli[r.cli] || (byCli[r.cli] = {cli:r.cli, cart:0, tot:0, m:{}});
    if (r.st==='T') o.cart += r.brl;
    else { o.m[r.mes] = (o.m[r.mes]||0)+r.brl; o.tot += r.brl; }
  });
  const list = Object.values(byCli).sort((a,b)=>{
    if (S.sort==='cli') return a.cli<b.cli ? -S.dir : a.cli>b.cli ? S.dir : 0;
    const g = o => S.sort==='tot'?o.tot : S.sort==='cart'?o.cart : (o.m[S.sort]||0);
    return (g(a)-g(b))*S.dir;
  });
  const th = (id,lab,cls) =>
    '<th data-sort="'+id+'" class="'+(cls||'')+'" tabindex="0" aria-sort="'
    + (S.sort===id?(S.dir===1?'asc':'desc'):'none')+'">'+lab+'</th>';
  setH('thr', th('cli',L.tCli) + th('cart',L.tCart,'cart')
    + COLS.map(m=>th(m, mn(m)+(m===CUR?' ●':''), m===CUR?'cur':'')).join('')
    + th('tot',L.tTot,'tot'));
  setH('tb', list.length ? list.map(o=>{
    const nv = FIRST[o.cli]===iCur;
    return '<tr><td class="cli'+(nv?' novo':'')+'" title="'+o.cli+'">'+o.cli
      + (nv?'<span class="tag">'+L.newTag+'</span>':'')+'</td>'
      + '<td class="cart'+(o.cart?'':' zero')+'">'+(o.cart?nf0(conv(o.cart)):'–')+'</td>'
      + COLS.map(m=>{const v=o.m[m]||0;
          return '<td class="'+(m===CUR?'cur':'')+(v?'':' zero')+'">'+(v?nf0(conv(v)):'–')+'</td>';}).join('')
      + '<td class="tot">'+nf0(conv(o.tot))+'</td></tr>';
  }).join('') : '<tr><td colspan="'+(COLS.length+3)+'" class="empty">'+L.noRows+'</td></tr>');
  setH('tf', '<td>'+L.tTotal+' · '+sym()+'</td>'
    + '<td style="color:var(--s2)">'+(totalTbi?nf0(conv(totalTbi)):'–')+'</td>'
    + COLS.map(m=>'<td>'+(byM[m].v?nf0(conv(byM[m].v)):'–')+'</td>').join('')
    + '<td>'+nf0(conv(totalInv))+'</td>');

  set('tcount', L.tcount(list.length, sym()));
  set('fcount', L.lines(inv.length, tbi.length));

  const novosPorMes = M.map(m=>[m, clis.filter(c=>M[FIRST[c]]===m)]).filter(x=>x[1].length).reverse();
  set('newSub', L.newSub(clis.length));
  setH('newList', novosPorMes.map(x=>
    '<span><b>'+mn(x[0])+'</b> · '+x[1].length+': '
    + x[1].map(c=>c.split(' ').slice(0,2).join(' ')).join(', ')+'</span>').join('')
    || '<span>'+L.noNew+'</span>');

  const keep = S.uf;
  const opts = [...new Set(R.filter(r=>r.st==='I').map(ufOf))].sort();
  setH('fUf', '<option value="">'+L.all+'</option>'
    + opts.map(u=>'<option'+(u===keep?' selected':'')+'>'+u+'</option>').join(''));
}

function drawBars(id, cols){
  const host = document.getElementById(id);
  host.querySelectorAll('.mcol').forEach(n=>n.remove());
  cols.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'mcol'+(c.m===CUR?' cur':'');
    el.innerHTML = '<div class="stack"><span class="mval '+(c.labelCls||'')+'">'+c.label+'</span>'
      + c.segs.map(s=>'<div class="'+s.cls+'" style="height:'+s.h+'%"></div>').join('')
      + '</div><span class="mlab">'+mn(c.m)+'</span>';
    el.addEventListener('mousemove', e=>showTip(e, c.tip));
    el.addEventListener('mouseleave', hideTip);
    host.appendChild(el);
  });
}

function spark(id, vals, hi){
  const max = Math.max.apply(null, vals.map(Math.abs).concat([1]));
  setH(id, vals.map((v,i)=>
    '<i class="'+(i===hi?'on':'')+'" style="height:'+Math.max(6,Math.abs(v)/max*100)+'%"></i>').join(''));
}

document.getElementById('fRep').onchange = e => { S.rep = e.target.value; render(); };
document.getElementById('fUf').onchange  = e => { S.uf  = e.target.value; render(); };
document.getElementById('fQ').oninput    = e => { S.q   = e.target.value; render(); };

function pillGroup(id, key, after){
  const g = document.getElementById(id);
  const sync = () => g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', S[key]===b.dataset.v));
  g.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b || S[key]===b.dataset.v) return;
    S[key] = b.dataset.v; if (after) after(); sync();
    if (key==='lang') applyLang();
    render();
  });
  sync(); return sync;
}
pillGroup('fGeo','geo', ()=>{ S.uf=''; });
const syncCur = pillGroup('fCur','cur');
/* EN traduz o texto e converte a moeda para USD; PT volta para BRL */
pillGroup('fLang','lang', ()=>{ S.cur = S.lang==='en' ? 'USD' : 'BRL'; syncCur(); });

document.getElementById('thr').addEventListener('click', e=>{
  const th = e.target.closest('th[data-sort]'); if(!th) return;
  const k = th.dataset.sort;
  if (S.sort===k) S.dir = -S.dir; else { S.sort = k; S.dir = k==='cli' ? 1 : -1; }
  render();
});
document.getElementById('thr').addEventListener('keydown', e=>{
  if (e.key==='Enter'||e.key===' '){ e.preventDefault(); e.target.click(); }
});
const ufb = document.getElementById('ufbars');
ufb.addEventListener('mousemove', e=>{
  const hb = e.target.closest('.hb'); if(!hb) return;
  showTip(e, '<span class="k">'+hb.dataset.uf+'</span><b>'+money(+hb.dataset.v)+'</b>');
});
ufb.addEventListener('mouseleave', hideTip);

document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

/* ---------- acesso ---------- */
function hash(s){ let x=5381; for (const c of s) x=((x*33)^c.charCodeAt(0))>>>0; return x; }
const KEY = 2519394238;
document.getElementById('gateForm').addEventListener('submit', e=>{
  e.preventDefault();
  const f = document.getElementById('gPass');
  if (hash(f.value.trim()) === KEY){
    document.getElementById('gate').remove();
    document.getElementById('app').hidden = false;
    render();
  } else { set('gErr', t().gerr); f.select(); }
});
document.getElementById('fLang').addEventListener('click', e=>{
  if (e.target.closest('button')) set('gErr','');
});
applyLang();
document.getElementById('gPass').focus();
</script>
