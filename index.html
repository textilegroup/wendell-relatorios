<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendas Wendell Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
:root{
  --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
  --bg:#F2F2F0; --card:#FFFFFF; --sunk:#F7F5F3;
  --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
  --line:#E3E0DD; --line-2:#EFECE9;
  --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8; --s4:#4E7A1E;
  --pos:#2C6B4F; --neg:#A33A2A;
  --chip:#F6F4F1;
  --shadow:0 1px 2px rgba(38,37,42,.06),0 1px 8px rgba(38,37,42,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
    --bg:#141316; --card:#1E1C21; --sunk:#26232A;
    --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
    --line:#332F38; --line-2:#2A272F;
    --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430; --s4:#6E9430;
    --pos:#5FA37E; --neg:#D97A62;
    --chip:#2A272F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
  --bg:#141316; --card:#1E1C21; --sunk:#26232A;
  --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
  --line:#332F38; --line-2:#2A272F;
  --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
  --pos:#5FA37E; --neg:#D97A62;
  --chip:#2A272F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}

/* ---------- gate ---------- */
#gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:linear-gradient(150deg,var(--wine-deep) 0%,var(--wine) 55%,#3C0812 100%);
}
.gate-box{
  background:var(--card);border-radius:14px;padding:26px 24px 20px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.32);text-align:center;
}
.gate-box .logo{margin:0 auto 12px;background:var(--wine);color:#fff;border-color:var(--wine-soft)}
.gate-box h2{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.gate-box p{margin:0 0 16px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.gate-box input{
  width:100%;font:inherit;font-size:14px;text-align:center;letter-spacing:.12em;
  padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);
}
.gate-box button[disabled]{opacity:.6;cursor:progress}
.gate-box button{
  width:100%;margin-top:9px;font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:10px;border:0;border-radius:9px;background:var(--wine);color:#fff;cursor:pointer;
}
.gate-box button:hover{background:var(--wine-soft)}
.gate-err{margin-top:9px;font-size:11.5px;color:var(--neg);font-weight:600;min-height:16px}
#app[hidden]{display:none}

/* ---------- header ---------- */
header{
  background:linear-gradient(100deg,var(--wine-deep) 0%,var(--wine) 62%,var(--wine-deep) 100%);
  color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
.logo{
  width:38px;height:38px;border-radius:50%;background:#fff;color:var(--wine-deep);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;
  border:2px solid rgba(255,255,255,.85);flex:none;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11px;opacity:.78;letter-spacing:.02em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hdr-chip{
  border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 10px;
  font-size:11.5px;font-weight:600;letter-spacing:.03em;background:rgba(255,255,255,.07);
  color:#fff;cursor:pointer;font-family:inherit;
}
.hdr-chip:hover{background:rgba(255,255,255,.16)}
.hdr-chip[disabled]{opacity:.45;cursor:progress}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang button{
  font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:5px 10px;
  border:0;background:transparent;color:rgba(255,255,255,.72);cursor:pointer;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--wine-deep)}

/* ---------- shell ---------- */
main{max-width:1560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:10px;padding:9px 14px 8px;border-bottom:2px solid var(--wine-soft);flex-wrap:wrap}
.card-hd h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--wine)}
.card-hd .sub{margin-left:auto;font-size:11px;color:var(--ink-3);letter-spacing:.02em;text-align:right}
.card-bd{padding:11px 14px 13px}

/* ---------- filters ---------- */
.frow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrp>label,.fgrp>.lb{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pills{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.pills button{
  font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--ink-2);
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.pills button[aria-pressed="true"]{background:var(--wine);color:#fff}
.pills button:focus-visible,input:focus-visible,.hdr-chip:focus-visible,.ms-btn:focus-visible,
.lang button:focus-visible,th[data-sort]:focus-visible,.tab:focus-visible{outline:2px solid var(--wine-soft);outline-offset:2px}
input[type="search"]{
  font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:210px;
}
.grow{flex:1 1 210px}

/* ---------- multiselect ---------- */
.ms{position:relative;min-width:172px}
.ms-btn{
  width:100%;display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left;
}
.ms-btn .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .cnt{
  font-size:10px;font-weight:700;background:var(--wine);color:#fff;border-radius:20px;padding:1px 6px;flex:none;
}
.ms-btn .car{color:var(--ink-3);font-size:10px;flex:none}
.ms-pop{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:100%;max-width:280px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.18);padding:7px;
}
.ms-pop[hidden]{display:none}
.ms-act{display:flex;gap:5px;margin-bottom:6px}
.ms-act button{
  flex:1;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink-2);border-radius:6px;cursor:pointer;
}
.ms-act button:hover{background:var(--sunk);color:var(--ink)}
.ms-list{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.ms-list label{
  display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.ms-list label:hover{background:var(--sunk)}
.ms-list input{accent-color:var(--wine);margin:0}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:10px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi .val{font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-size:25px;font-weight:700;
  letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-right:.22em}
.kpi .meta{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.delta{font-weight:700}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)}
.spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:5px}
.spark i{flex:1;background:var(--s1);opacity:.35;border-radius:2px 2px 0 0;min-height:2px}
.spark i.on{opacity:1}
.spark.c2 i{background:var(--s2)}
.spark.c3 i{background:var(--s3)}
.spark.c4 i{background:var(--s4)}

/* ---------- charts ---------- */
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;align-items:start}
.stackcol{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-2);
  margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(255,255,255,.8) 2px 4px)}

.bars{display:flex;align-items:flex-end;gap:6px;height:176px;position:relative}
.bars.short{height:142px}
.grid-lines{position:absolute;inset:16px 0 24px;pointer-events:none}
.grid-lines div{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.stack{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bar{background:var(--s1);border-radius:4px 4px 0 0;min-height:2px;transition:filter .12s}
.bar.b2{background:var(--s2)}
.bar.b3{background:var(--s3)}
.bar.b3.negv{background:var(--neg)}
.bar.part{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.45) 4px 8px)}
.mcol:hover .bar{filter:brightness(1.12)}
.mcol.cur .bar{outline:2px solid var(--wine-soft);outline-offset:1px}
.mlab{text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);padding-top:5px;
  border-top:1px solid var(--line);margin-top:4px;letter-spacing:.04em}
.mval{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-2);
  font-family:"Archivo Narrow",Archivo,sans-serif;padding-bottom:3px;min-height:14px}
.mval.na{color:var(--ink-3);font-weight:400}

.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:9px;font-size:12px}
.hb .uf{font-weight:700;letter-spacing:.04em;color:var(--ink)}
.hb .track{display:block;background:var(--sunk);border-radius:4px;height:15px;overflow:hidden}
.hb .fill{display:block;height:100%;background:var(--s1);border-radius:4px}
.hb .amt{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:600;color:var(--ink-2);white-space:nowrap}
.hint{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.45}
code{font-size:.94em;background:var(--sunk);padding:1px 4px;border-radius:4px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px 0;border-bottom:1px solid var(--line)}
.tab{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 11px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--ink-3);
  border-radius:8px 8px 0 0;cursor:pointer;margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2);background:var(--sunk)}
.tab[aria-selected="true"]{
  background:var(--card);border-color:var(--line);color:var(--wine);
  box-shadow:inset 0 2px 0 var(--wine);
}
.tab .n{font-weight:600;color:var(--ink-3);margin-left:4px}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--sunk);color:var(--ink-2);
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead th:first-child{text-align:left;left:0;z-index:5}
thead th.txt{text-align:left}
thead th.cart{color:var(--s2)}
thead th.cur{color:var(--wine)}
thead th[aria-sort="desc"]::after{content:" ▾";font-size:9px}
thead th[aria-sort="asc"]::after{content:" ▴";font-size:9px}
tbody td{
  padding:4px 8px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-weight:500;
}
tbody td.cli{
  text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  font-family:"Archivo",Arial,sans-serif;font-weight:500;max-width:250px;overflow:hidden;
  text-overflow:ellipsis;border-right:1px solid var(--line);
}
tbody td.txt{text-align:left;font-family:Archivo,Arial,sans-serif;color:var(--ink-2);font-size:11.5px}
tbody td.cli.novo{box-shadow:inset 3px 0 0 var(--pos);padding-left:11px}
tbody td.cli.rk{padding-left:11px}
tbody td.cli .pos{color:var(--ink-3);font-weight:600;margin-right:6px;font-size:11px}
tbody tr:hover td,tbody tr:hover td.cli{background:var(--sunk)}
td.zero{color:var(--ink-3);font-weight:400}
td.cart{color:var(--s2);font-weight:700;background:color-mix(in srgb,var(--s2) 8%,transparent)}
tbody tr:hover td.cart{background:color-mix(in srgb,var(--s2) 14%,transparent)}
td.cart.zero{color:var(--ink-3);font-weight:400;background:none}
td.cur{font-weight:700;color:var(--ink)}
td.tot{font-weight:700;border-left:1px solid var(--line)}
td.warn{color:var(--neg);font-weight:700}
tfoot td{
  padding:7px 8px;text-align:right;font-weight:700;font-family:"Archivo Narrow",Archivo,sans-serif;
  border-top:2px solid var(--wine-soft);background:var(--sunk);white-space:nowrap;
}
tfoot td:first-child{
  text-align:left;position:sticky;left:0;background:var(--sunk);font-family:Archivo,Arial,sans-serif;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);
}
.tag{
  display:inline-block;font-family:Archivo,sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;
  background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos);
}
.newlist{display:flex;flex-wrap:wrap;gap:6px}
.newlist span{font-size:11px;background:var(--chip);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;color:var(--ink-2)}

#tip{
  position:fixed;pointer-events:none;z-index:90;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:240px;
}
#tip b{font-family:"Archivo Narrow",Archivo,sans-serif}
#tip .k{color:var(--ink-3);font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:block}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
footer{font-size:10.5px;color:var(--ink-3);text-align:center;padding:2px 0 0;line-height:1.6}

/* toast */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;
  padding:10px 16px;border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.28);
  max-width:min(520px,92vw);text-align:center;opacity:0;pointer-events:none;transition:opacity .18s;
}
#toast.on{opacity:1}
#toast.err{background:var(--neg);color:#fff}
.pfilters{display:none}
#pmore{display:none}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  body{font-size:12.5px}
  main{padding:10px 10px 30px;gap:10px}
  .brand h1{font-size:16px}
  .logo{width:32px;height:32px;font-size:11px}
  .kpi .val{font-size:21px}
  .card-bd{padding:10px 11px 12px}
  .frow{gap:10px 12px}
  input[type="search"]{min-width:0;width:100%}
  .fgrp{flex:1 1 46%}
  .fgrp.grow,.fgrp:has(.pills){flex:1 1 100%}
  .ms{min-width:0;width:100%}
  .pills{width:100%}
  .pills button{flex:1;padding:6px 6px;font-size:11.5px}
  tbody td.cli{max-width:126px;font-size:11px}
  .bars{height:132px}.bars.short{height:118px}
  .mval{font-size:9px}.mlab{font-size:9.5px}
  .tabs{padding:7px 8px 0;gap:3px}
  .tab{font-size:10px;padding:6px 8px;letter-spacing:.04em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- impressão: 1 página paisagem ---------- */
@media print{
  @page{size:A4 landscape;margin:7mm}
  html,body{background:#fff!important}
  header{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hdr-right,.no-print,#toast,#tip,.hint,.tabs,#newCard{display:none!important}
  .pfilters{display:block;font-size:9px;color:#444;padding:5px 14px 0}
  main{padding:4px 7px 0;gap:5px;max-width:none}
  .two{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .stackcol{display:contents}
  .legend{font-size:8px;gap:7px}
  .mval{font-size:8px;min-height:11px}
  .mlab{font-size:8px;padding-top:3px}
  .hb{font-size:9px;gap:6px;grid-template-columns:32px 1fr auto}
  .hb .track{height:11px}
  thead th{font-size:8px;padding:4px 5px}
  tfoot td{font-size:9px;padding:4px 5px}
  tbody td{font-size:9px}
  tbody td.cli{max-width:210px;font-size:9px}
  footer{font-size:7.5px;padding-top:3px}
  .card-hd h2{font-size:9.5px}
  .kpi .lab{font-size:7.5px}
  .kpi .meta{font-size:8px}
  .card,.kpi{box-shadow:none}
  .kpi{break-inside:avoid}
  tr{break-inside:avoid}
  .kpis{gap:5px;grid-template-columns:repeat(4,1fr)}
  .kpi{padding:6px 9px 7px}
  .kpi .val{font-size:16px}
  .kpi .spark{display:none}
  .card-bd{padding:7px 9px 8px}
  .card-hd{padding:6px 10px 5px}
  .bars{height:88px}.bars.short{height:76px}
  .tscroll{overflow:visible}
  thead th{position:static}
  /* impede o Chrome de tratar o tfoot como rodape repetido da pagina */
  tfoot{display:table-row-group}
  tbody td.cli,tfoot td:first-child,thead th:first-child{position:static}
  tbody td{padding:2px 6px}
  tbody tr.pcut{display:none}
  #pmore{display:table-row}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#pmore td{text-align:center;font-family:Archivo,sans-serif;font-size:9px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;padding:4px}
</style>
</head>
<body>


<div id="gate">
  <form class="gate-box" id="gateForm">
    <div class="logo">WGI</div>
    <h2 id="gTitle">Relatório de Vendas</h2>

function boot(d){
  DATA = d;

     pedido e lanca o valor uma unica vez, na primeira linha do pedido */
  const og = {};

    const k = r.mes+'|'+r.ped+'|'+r.cli; (og[k] || (og[k] = [])).push(r);

    const v = g.filter(r=>r.frRaw !== null && r.frRaw !== undefined).map(r=>r.frRaw);
    if (!v.length) return;
    g[0].frt = Math.max.apply(null, v);
    g.forEach(r => r.frb = r.brl);
  });
  ANOS = [...new Set(R.map(r=>r.ano))].sort();
  if (!M.length){ M = [MO_ALL[new Date().getMonth()]]; DATA.atual = M[0]; }
  MS = M.slice(); CUR = DATA.atual || M[M.length-1]; COLS = [...M].reverse();
  FIRST = {}; LAST = {}; FIRSTD = {};
  R.filter(r=>r.st==='I').forEach(r=>{
    const i = M.indexOf(r.mes);
    if (FIRST[r.cli]===undefined || i < FIRST[r.cli]) FIRST[r.cli] = i;
    if (r.dt && (FIRSTD[r.cli]===undefined || r.dt < FIRSTD[r.cli])) FIRSTD[r.cli] = r.dt;
    if (LAST[r.cli]===undefined  || i > LAST[r.cli])  LAST[r.cli]  = i;
  });
}

  COLS = [...MS].reverse();
}
const t = () => T[S.lang];
const mn = m => S.lang==='en' ? (MES_EN[m]||m) : m;
const loc = () => S.lang==='en' ? 'en-US' : 'pt-BR';

const conv = v => S.cur==='BRL' ? v : v/FX;
const sym  = () => S.cur==='BRL' ? 'R$' : 'US$';
const nf0 = v => new Intl.NumberFormat(loc(),{maximumFractionDigits:0}).format(v);
const nf1 = v => new Intl.NumberFormat(loc(),{minimumFractionDigits:1,maximumFractionDigits:1}).format(v);
const money = v => sym()+' '+nf0(conv(v));
function compact(v){
  const x = conv(v), MI = S.lang==='en' ? 'M' : ' mi', K = S.lang==='en' ? 'k' : ' mil';
  if (Math.abs(x) >= 1e6) return nf1(x/1e6)+MI;
  if (Math.abs(x) >= 1e3) return nf0(Math.round(x/1e3))+K;
  return nf0(x);
}
const pct = v => nf1(v)+'%';
const fdate = iso => { const p = String(iso).split('-');
  return p.length===3 ? (S.lang==='en' ? p[1]+'/'+p[2] : p[2]+'/'+p[1]) : String(iso); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ufOf = r => S.geo==='uf' ? (UF_CLIENTE[r.cli] || '—') : r.wh;
const hasUf = () => Object.values(UF_CLIENTE).some(v => v && v.trim());

const filtered = () => {

  return R.filter(r =>
    MS.indexOf(r.mes) >= 0 &&
    (!S.anos.size || S.anos.has(r.ano)) &&
    (!S.reps.size || S.reps.has(r.rep)) &&

};

/* ================= multiselect ================= */
function msInit(id, key, getOptions, fmt){
  const F = fmt || (v=>v);
  const root = el(id), btn = root.querySelector('.ms-btn'), pop = root.querySelector('.ms-pop');
  const list = root.querySelector('.ms-list');
  function paint(){
    const L = t(), sel = S[key];
    root.querySelectorAll('.ms-act button')[0].textContent = L.all;
    root.querySelectorAll('.ms-act button')[1].textContent = L.clear;
    const lab = btn.querySelector('.lab'), cnt = btn.querySelector('.cnt');
    if (!sel.size){ lab.textContent = L.all; cnt.hidden = true; }
    else if (sel.size === 1){ lab.textContent = F([...sel][0]); cnt.hidden = true; }
    else { lab.textContent = L.nsel(sel.size); cnt.hidden = false; cnt.textContent = sel.size; }
  }
  function fill(){
    const opts = getOptions();
    [...S[key]].forEach(v=>{ if (!opts.includes(v)) S[key].delete(v); });
    list.innerHTML = opts.map(o=>
      '<label><input type="checkbox" value="'+esc(o)+'"'+(S[key].has(o)?' checked':'')+'><span>'+esc(F(o))+'</span></label>').join('');
    paint();
  }
  list.addEventListener('change', e=>{
    if (e.target.checked) S[key].add(e.target.value); else S[key].delete(e.target.value);
    paint(); render();
  });
  root.querySelector('.ms-act').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if (b.dataset.act === 'all') getOptions().forEach(o=>S[key].add(o)); else S[key].clear();
    list.querySelectorAll('input').forEach(i=>i.checked = S[key].has(i.value));
    paint(); render();
  });
  btn.addEventListener('click', ()=>{
    const open = pop.hidden;
    document.querySelectorAll('.ms-pop').forEach(p=>p.hidden = true);
    document.querySelectorAll('.ms-btn').forEach(b=>b.setAttribute('aria-expanded','false'));
    pop.hidden = !open; btn.setAttribute('aria-expanded', String(open));
  });
  return {fill, paint};
}
document.addEventListener('click', e=>{
  if (!e.target.closest('.ms')) {
    document.querySelectorAll('.ms-pop').forEach(p=>p.hidden = true);
    document.querySelectorAll('.ms-btn').forEach(b=>b.setAttribute('aria-expanded','false'));
  }
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape') document.querySelectorAll('.ms-pop').forEach(p=>p.hidden = true);
});

/* ================= render ================= */
function render(){
  setPeriod();
  const L = t(), rows = filtered();
  const inv = rows.filter(r=>r.st==='I'), tbi = rows.filter(r=>r.st==='T');

  const byM = {}; MS.forEach(m=>byM[m]={v:0, cw:0, mw:0, mb:0, ft:0, fb:0});
  inv.forEach(r=>{
    const a = byM[r.mes]; if (!a) return;
    a.v += r.brl; a.cw += r.brl*r.com;
    a.ft += r.frt; a.fb += r.frb;
    if (r.mg !== null && r.mg !== undefined){ a.mw += r.brl*r.mg; a.mb += r.brl; }
  });
  const totalInv = inv.reduce((a,r)=>a+r.brl,0);
  const totalTbi = tbi.reduce((a,r)=>a+r.brl,0);
  const active = MS.filter(m=>byM[m].v>0);
  const avg = active.length ? totalInv/active.length : 0;
  const iCur = M.indexOf(CUR), iSel = MS.indexOf(CUR), prev = MS[iSel-1];

  /* 1 · faturamento */
  const dPct = prev && byM[prev].v ? (byM[CUR].v-byM[prev].v)/byM[prev].v*100 : null;
  setH('kTot','<small>'+sym()+'</small>'+compact(totalInv));
  setH('kTotMeta',
    (dPct===null?'':'<span class="delta '+(dPct>=0?'up':'down')+'">'+(dPct>=0?'▲':'▼')+' '+pct(Math.abs(dPct))+'</span> ')
    + L.vs(mn(CUR), prev?mn(prev):null, money(byM[CUR].v)));
  spark('kSpark', MS.map(m=>byM[m].v), iSel);

  /* 2 · estado */
  const byU = {};
  inv.forEach(r=>{ const u=ufOf(r); byU[u]=(byU[u]||0)+r.brl; });
  const uList = Object.entries(byU).sort((a,b)=>b[1]-a[1]);
  const top = uList[0];
  set('kUf', top ? top[0] : '—');
  set('kUfMeta', top ? L.share(money(top[1]), nf1(top[1]/totalInv*100), uList.length) : '—');
  spark('kUfSpark', uList.map(u=>u[1]), 0);
  set('geoLab', S.geo==='uf' ? L.geoLabUf : L.geoLabWh);
  const maxU = top ? top[1] : 1;
  setH('ufbars', uList.map(x=>
    '<div class="hb" data-uf="'+esc(x[0])+'" data-v="'+x[1]+'"><span class="uf">'+esc(x[0])+'</span>'
    +'<span class="track"><span class="fill" style="width:'+Math.max(2,x[1]/maxU*100)+'%"></span></span>'
    +'<span class="amt">'+money(x[1])+'</span></div>').join('')
    || '<p class="hint">'+L.noData+'</p>');
  setH('ufHint', S.geo==='uf' ? (hasUf()?L.hintUfOk:L.hintUfEmpty) : L.hintWh);

  /* 3 · média */
  setH('kAvg','<small>'+sym()+'</small>'+compact(avg));
  set('kAvgMeta', L.avgMeta(active.length, money(avg*12)));
  spark('kAvgSpark', MS.map(m=>byM[m].v), -1);

  /* 4 · clientes novos */
  const clis = [...new Set(inv.map(r=>r.cli))];
  const newByM = {}; MS.forEach(m=>newByM[m]=0);
  const novosMes = [];
  clis.forEach(c=>{
    const i = FIRST[c]; if (i===undefined) return;
    if (newByM[M[i]] !== undefined) newByM[M[i]]++;
    if (M[i]===CUR) novosMes.push(c);
  });
  set('kNew', novosMes.length);
  set('kNewMeta', L.newMeta(mn(CUR), clis.length));
  spark('kNewSpark', MS.map(m=>newByM[m]), iSel);

  /* 5 · comissão ponderada */
  const comW = inv.reduce((a,r)=>a+r.brl*r.com, 0);
  const nPed = new Set(inv.filter(r=>r.com>0).map(r=>r.mes+'|'+r.ped+'|'+r.cli)).size;
  set('kCom', totalInv ? pct(comW/totalInv*100) : '—');
  set('kComMeta', L.comMeta(money(comW), nPed));
  spark('kComSpark', MS.map(m=>byM[m].v ? byM[m].cw/byM[m].v*100 : 0), iSel);

  /* 6 · margem ponderada */
  const mgW = MS.reduce((a,m)=>a+byM[m].mw,0), mgB = MS.reduce((a,m)=>a+byM[m].mb,0);
  const covTot = totalInv ? mgB/totalInv*100 : 0;
  set('kMg', mgB ? pct(mgW/mgB*100) : '—');
  set('kMgMeta', L.mgMeta(nf0(covTot)));
  spark('kMgSpark', MS.map(m=>byM[m].mb ? byM[m].mw/byM[m].mb*100 : 0), iSel);

  /* 7 · frete ponderado sobre o faturamento */
  const frT = MS.reduce((a,m)=>a+byM[m].ft,0), frB = MS.reduce((a,m)=>a+byM[m].fb,0);
  set('kFrt', frB ? pct(frT/frB*100) : '—');
  set('kFrtMeta', L.frtMeta(money(frT), nf0(totalInv ? frB/totalInv*100 : 0)));
  spark('kFrtSpark', MS.map(m=>byM[m].fb ? byM[m].ft/byM[m].fb*100 : 0), iSel);

  /* gráfico faturamento */
  const maxBar = Math.max.apply(null, MS.map(m=>byM[m].v).concat([byM[CUR].v+totalTbi, 1]));
  setH('glines',[0,25,50,75].map(p=>'<div style="top:'+p+'%"></div>').join(''));
  drawBars('chart', MS.map(m=>{
    const v = byM[m].v, tb = (m===CUR ? totalTbi : 0);
    return {m, label: v?compact(v):'',
      segs: (tb?[{cls:'bar b2', h:tb/maxBar*100}]:[]).concat([{cls:'bar', h:v/maxBar*100}]),
      tip:'<span class="k">'+mn(m)+'/'+DATA.ano+'</span><b>'+money(v)+'</b> '+L.tipInv
        + (tb?'<br><b style="color:var(--s2)">'+money(tb)+'</b> '+L.tipBack:'')};
  }));

  /* gráfico margem */
  const mg = MS.map(m=>{
    const a = byM[m];
    return {m, p: a.mb ? a.mw/a.mb*100 : null, cov: a.v ? a.mb/a.v*100 : 0};
  });
  const maxMg = Math.max.apply(null, mg.map(x=>Math.abs(x.p||0)).concat([1]));
  setH('glinesM',[0,33,66].map(p=>'<div style="top:'+p+'%"></div>').join(''));
  drawBars('chartM', mg.map(x=>({
    m: x.m,
    label: x.p===null ? '–' : pct(x.p),
    labelCls: x.p===null ? 'na' : '',
    segs: x.p===null ? [{cls:'bar b3', h:0}]
        : [{cls:'bar b3'+(x.p<0?' negv':'')+(x.cov<60?' part':''), h:Math.abs(x.p)/maxMg*100}],
    tip: '<span class="k">'+mn(x.m)+'/'+DATA.ano+'</span>'
       + (x.p===null ? L.tipNoMg
         : '<b>'+pct(x.p)+'</b> '+L.tipMg+'<br>'+L.tipCov+': '+nf0(x.cov)+'% '+L.tipInv)
  })));
  setH('mgHint', L.mgHint(nf0(covTot)));

  /* abas + tabela */
  buildTabs(rows, inv, clis);
  renderTable(rows, inv, byM, totalInv, totalTbi, iCur);

  set('fcount', L.lines(inv.length, tbi.length));

  const novosPorMes = MS.map(m=>[m, clis.filter(c=>M[FIRST[c]]===m)]).filter(x=>x[1].length).reverse();
  set('newSub', L.newSub(clis.length));
  setH('newList', novosPorMes.map(x=>
    '<span><b>'+mn(x[0])+'</b> · '+x[1].length+': '
    + x[1].map(c=>esc(c.split(' ').slice(0,2).join(' '))).join(', ')+'</span>').join('')
    || '<span>'+L.noNew+'</span>');

  MSUF.fill(); MSANO.fill();
}

/* ---- agregações por chave ---- */
function agg(rows, keyOf){
  const o = {};
  rows.forEach(r=>{
    const k = keyOf(r); if (k===undefined || k===null) return;
    const a = o[k] || (o[k] = {key:k, cart:0, tot:0, m:{}, cw:0});
    if (r.st==='T') a.cart += r.brl;
    else { a.m[r.mes] = (a.m[r.mes]||0)+r.brl; a.tot += r.brl; a.cw += r.brl*r.com; }
  });
  return Object.values(o);
}

function buildTabs(rows, inv, clis){
  const L = t();
  const nInat = clis.filter(c=>LAST[c] !== M.indexOf(CUR)).length;
  const counts = {all:agg(rows,r=>r.cli).length, top10:Math.min(10,agg(inv,r=>r.cli).length),
    novos:clis.filter(c=>FIRST[c]===M.indexOf(CUR)).length, inativos:nInat,
    reps:agg(inv,r=>r.rep||'—').length, estados:agg(inv,r=>ufOf(r)).length};
  setH('tabs', TABS.map(k=>
    '<button class="tab" role="tab" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'">'
    + L.tabs[k] + '<span class="n">'+counts[k]+'</span></button>').join(''));
}

function renderTable(rows, inv, byM, totalInv, totalTbi, iCur){
  const L = t();
  let list, extra = [], trail = [], showTot = true, firstLab = L.tCli, rank = false;

  if (S.tab === 'reps'){
    firstLab = L.colRep; rank = true; showTot = true;
    list = agg(rows, r=>r.rep || '—');
    trail = [
      {id:'share', lab:L.colShare, get:o=>totalInv?pct(o.tot/totalInv*100):'–'},
      {id:'com',   lab:L.colCom,   get:o=>o.tot?pct(o.cw/o.tot*100):'–'}
    ];
  } else if (S.tab === 'estados'){
    firstLab = L.colUf; rank = true;
    list = agg(rows, r=>ufOf(r));
    trail = [{id:'share', lab:L.colShare, get:o=>totalInv?pct(o.tot/totalInv*100):'–'}];
  } else {
    list = agg(rows, r=>r.cli);
    if (S.tab === 'top10'){
      rank = true;
      list = list.filter(o=>o.tot>0).sort((a,b)=>b.tot-a.tot).slice(0,10);
    } else if (S.tab === 'novos'){
      list = list.filter(o=>FIRST[o.key] === iCur);
      extra = [{id:'in', lab:L.colIn,
                get:o=>FIRSTD[o.key] ? fdate(FIRSTD[o.key]) : mn(M[FIRST[o.key]]),
                sortv:o=>FIRSTD[o.key]||''}];
    } else if (S.tab === 'inativos'){
      list = list.filter(o=>FIRST[o.key] !== undefined && LAST[o.key] !== iCur);
      extra = [
        {id:'last', lab:L.colLast, get:o=>mn(M[LAST[o.key]]), sortv:o=>LAST[o.key]},
        {id:'gap',  lab:L.colGap,  get:o=>String(iCur-LAST[o.key]), sortv:o=>iCur-LAST[o.key], cls:'warn'}
      ];
    }
  }

  const valOf = (o,k) => k==='tot' ? o.tot : k==='cart' ? o.cart
    : k==='key' ? o.key
    : (extra.concat(trail).find(x=>x.id===k)||{}).sortv ? extra.concat(trail).find(x=>x.id===k).sortv(o)
    : k==='share' ? o.tot : k==='com' ? (o.tot?o.cw/o.tot:0)
    : (o.m[k]||0);
  const fixed = (S.tab==='top10'||S.tab==='reps'||S.tab==='estados') && S.sort==='tot' && S.dir===-1;
  if (!fixed){
    list.sort((a,b)=>{
      const x = valOf(a,S.sort), y = valOf(b,S.sort);
      if (typeof x === 'string' || typeof y === 'string')
        return String(x)<String(y) ? -S.dir : String(x)>String(y) ? S.dir : 0;
      return (x-y)*S.dir;
    });
  } else list.sort((a,b)=>b.tot-a.tot);

  const th = (id,lab,cls) =>
    '<th data-sort="'+id+'" class="'+(cls||'')+'" tabindex="0" aria-sort="'
    + (S.sort===id?(S.dir===1?'asc':'desc'):'none')+'">'+lab+'</th>';
  setH('thr', th('key',firstLab)
    + extra.map(x=>th(x.id,x.lab,'txt')).join('')
    + th('cart',L.tCart,'cart')
    + COLS.map(m=>th(m, mn(m)+(m===CUR?' ●':''), m===CUR?'cur':'')).join('')
    + th('tot',L.tTot,'tot')
    + trail.map(x=>th(x.id,x.lab)).join(''));

  const nCols = 2 + extra.length + COLS.length + trail.length;
  setH('tb', list.length ? list.map((o,i)=>{
    const nv = S.tab!=='reps' && S.tab!=='estados' && FIRST[o.key]===iCur;
    return '<tr'+(i>=PRINT_ROWS?' class="pcut"':'')+'>'
      + '<td class="cli'+(nv?' novo':'')+(rank?' rk':'')+'" title="'+esc(o.key)+'">'
      + (rank?'<span class="pos">'+(i+1)+'</span>':'') + esc(o.key)
      + (nv?'<span class="tag">'+L.newTag+'</span>':'') + '</td>'
      + extra.map(x=>'<td class="txt'+(x.cls?' '+x.cls:'')+'">'+x.get(o)+'</td>').join('')
      + '<td class="cart'+(o.cart?'':' zero')+'">'+(o.cart?nf0(conv(o.cart)):'–')+'</td>'
      + COLS.map(m=>{const v=o.m[m]||0;
          return '<td class="'+(m===CUR?'cur':'')+(v?'':' zero')+'">'+(v?nf0(conv(v)):'–')+'</td>';}).join('')
      + '<td class="tot">'+nf0(conv(o.tot))+'</td>'
      + trail.map(x=>'<td>'+x.get(o)+'</td>').join('')
      + '</tr>';
  }).join('') : '<tr><td colspan="'+nCols+'" class="empty">'+L.noRows+'</td></tr>');

  el('pmoreTd').colSpan = nCols;
  set('pmoreTd', list.length>PRINT_ROWS ? L.pmore(list.length-PRINT_ROWS) : '');
  el('pmore').style.visibility = list.length>PRINT_ROWS ? 'visible' : 'collapse';

  const fCart = list.reduce((a,o)=>a+o.cart,0);
  const fTot  = list.reduce((a,o)=>a+o.tot,0);
  const fM = {}; COLS.forEach(m=>fM[m] = list.reduce((a,o)=>a+(o.m[m]||0),0));
  setH('tf', '<td>'+L.tTotal+' · '+sym()+'</td>'
    + extra.map(()=>'<td></td>').join('')
    + '<td style="color:var(--s2)">'+(fCart?nf0(conv(fCart)):'–')+'</td>'
    + COLS.map(m=>'<td>'+(fM[m]?nf0(conv(fM[m])):'–')+'</td>').join('')
    + '<td>'+nf0(conv(fTot))+'</td>'
    + trail.map(x=>{

const td = b => new TextDecoder('utf-8').decode(b);
async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined') throw new Error(t().impNoZip);
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('zip');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let i = 0; i < n; i++){
    const nameLen = dv.getUint16(p + 28, true), extLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true), method = dv.getUint16(p + 10, true);
    const cSize = dv.getUint32(p + 20, true), lho = dv.getUint32(p + 42, true);
    const name = td(buf.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true), lExtLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtLen;
    const raw = buf.subarray(start, start + cSize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    p += 46 + nameLen + extLen + cmtLen;
  }
  return out;
}
const unesc = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                    .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(d))
                    .replace(/&amp;/g,'&');
function sharedStrings(xml){
  const out = [];
  const si = xml.match(/<si\b[^>]*\/>|<si\b[^>]*>[\s\S]*?<\/si>/g) || [];
  si.forEach(s=>{
    let txt = '';
    (s.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).forEach(m=>{
      txt += unesc(m.replace(/<t[^>]*>/,'').replace(/<\/t>/,''));
    });
    out.push(txt);
  });
  return out;
}
const colIdx = ref => {
  let n = 0;
  for (const ch of ref.replace(/\d+/g,'')) n = n*26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
function sheetRows(xml, shared){
  const rows = [];
  (xml.match(/<row\b[^>]*\/>|<row\b[^>]*>[\s\S]*?<\/row>/g) || []).forEach(rx=>{
    const cells = [];
    (rx.match(/<c\b[^>]*\/>|<c\b[^>]*>[\s\S]*?<\/c>/g) || []).forEach(cx=>{
      const ref = (cx.match(/ r="([A-Z]+\d+)"/) || [])[1];
      if (!ref) return;
      const type = (cx.match(/ t="([^"]+)"/) || [])[1];
      let val = null;
      if (type === 'inlineStr'){
        const m = cx.match(/<t[^>]*>([\s\S]*?)<\/t>/); val = m ? unesc(m[1]) : '';
      } else {
        const m = cx.match(/<v>([\s\S]*?)<\/v>/);
        if (m){
          if (type === 's') val = shared[+m[1]] ?? '';
          else if (type === 'str' || type === 'e') val = unesc(m[1]);
          else val = parseFloat(m[1]);
        }
      }
      cells[colIdx(ref)] = val;
    });
    rows.push(cells);
  });
  return rows;
}
const serialToISO = v => {
  if (typeof v !== 'number' || !isFinite(v)) return null;
  const d = new Date(Date.UTC(1899,11,30) + v*86400000);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
};
let MISSING = [];
const norm = s => String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function findCol(head, ...cands){
  for (const c of cands){
    const i = head.findIndex(h => norm(h) === norm(c));
    if (i >= 0) return i;
  }
  for (const c of cands){
    const i = head.findIndex(h => norm(h).startsWith(norm(c)));
    if (i >= 0) return i;
  }
  return -1;
}
function buildData(cells, fileName){
  const head = cells[0] || [];
  const c = {
    mes:  findCol(head,'Month','Mês','Mes'),
    rep:  findCol(head,'Rep','Representante'),
    wh:   findCol(head,'WH','Warehouse'),
    st:   findCol(head,'Status'),
    cli:  findCol(head,'Customer','Cliente'),
    brl:  findCol(head,'Total per item (BRL Value)','Total per item'),
    qtd:  findCol(head,'Quantity (m)','Quantity'),
    ped:  findCol(head,'Order Number','Pedido'),
    dt:   findCol(head,'Date','Data'),
    com:  findCol(head,'Comission','Commission','Comissão'),
    mg:   findCol(head,'Margin','Margem'),
    fr:   findCol(head,'Total Freight','Frete')
  };
  const NOME = {mes:'Month', st:'Status', cli:'Customer', brl:'Total per item (BRL Value)',
                rep:'Rep', wh:'WH', qtd:'Quantity (m)', ped:'Order Number', dt:'Date',
                com:'Comission', mg:'Margin', fr:'Total Freight'};
  const falta = ['mes','st','cli','brl'].filter(k=>c[k]<0).map(k=>NOME[k]);
  if (falta.length) throw new Error(t().impFalta(falta.join(', ')));
  MISSING = ['rep','wh','ped','dt','com','mg','fr'].filter(k=>c[k]<0).map(k=>NOME[k]);
  const rows = [];
  for (let i = 1; i < cells.length; i++){
    const r = cells[i] || [];
    const cli = r[c.cli];
    if (!cli || typeof cli !== 'string' || !String(cli).trim()) continue;
    const mes = String(r[c.mes]||'').trim().toUpperCase();
    if (!MO_ALL.includes(mes)) continue;
    const mgv = c.mg>=0 && typeof r[c.mg] === 'number' ? Math.round(r[c.mg]*1e6)/1e6 : null;
    rows.push([mes,
      c.rep>=0 ? String(r[c.rep]||'').trim() : '',
      c.wh>=0  ? String(r[c.wh]||'').trim()  : '',
      String(r[c.st]||'').trim().toLowerCase()==='invoiced' ? 'I' : 'T',
      String(cli).trim(),
      Math.round((+r[c.brl]||0)*100)/100,
      +r[c.qtd] || 0,
      c.ped>=0 ? String(r[c.ped]??'').trim() : '',
      c.dt>=0 ? (typeof r[c.dt]==='number' ? serialToISO(r[c.dt]) : (r[c.dt]||null)) : null,
      c.com>=0 ? (+r[c.com]||0) : 0,
      mgv,
      c.fr>=0 && typeof r[c.fr] === 'number' ? Math.round(r[c.fr]*100)/100 : null]);
  }
  if (!rows.length) throw new Error(t().impSemLinhas);
  const meses = MO_ALL.filter(m => rows.some(r=>r[0]===m));
  const anoRow = rows.find(r=>r[8]);
  return {
    meses, atual: meses[meses.length-1],
    ano: anoRow ? +String(anoRow[8]).slice(0,4) : DATA.ano,
    fx: DATA.fx, rows,
    reps: [...new Set(rows.map(r=>r[1]).filter(Boolean))].sort(),
    clientes: [...new Set(rows.map(r=>r[4]))].sort(),
    fonte: fileName
  };
}

el('fFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const btn = el('btnImport'); btn.disabled = true;
  try{
    const files = await unzip(new Uint8Array(await f.arrayBuffer()));
    const wb = td(files['xl/workbook.xml'] || new Uint8Array());
    const rels = td(files['xl/_rels/workbook.xml.rels'] || new Uint8Array());
    const shared = files['xl/sharedStrings.xml'] ? sharedStrings(td(files['xl/sharedStrings.xml'])) : [];
    /* atributos podem vir em qualquer ordem, e o Target pode ser absoluto:
       le cada tag inteira e extrai os atributos um a um */
    const attr = (tag, name) => {
      const m = tag.match(new RegExp('\\b'+name+'="([^"]*)"'));
      return m ? unesc(m[1]) : null;
    };
    const sheets = (wb.match(/<sheet\b[^>]*\/?>/g) || [])
      .map(tag=>({name:attr(tag,'name'), rid:attr(tag,'r:id') || attr(tag,'id')}))
      .filter(x=>x.name);
    const relMap = {};
    (rels.match(/<Relationship\b[^>]*\/?>/g) || []).forEach(tag=>{
      const id = attr(tag,'Id'), tg = attr(tag,'Target');
      if (id && tg) relMap[id] = tg;
    });
    const resolve = tg => {
      if (!tg) return null;
      const c = tg.replace(/^\//,'').replace(/^\.\//,'');
      for (const cand of [c, 'xl/'+c, c.replace(/^xl\//,'')])
        if (files[cand]) return cand;
      return null;
    };
    const pick = sheets.find(x=>norm(x.name)==='base') || sheets[0];
    /* ultimo recurso: a primeira planilha que existir no pacote */
    const path = (pick && resolve(relMap[pick.rid]))
      || Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d*\.xml$/.test(k)).sort()[0];
    if (!path) throw new Error(t().impNoBase);
    const nd = buildData(sheetRows(td(files[path]), shared), f.name);
    boot(nd);
    S.reps.clear(); S.ufs.clear(); S.anos.clear(); S.meses.clear();
    S.q = ''; el('fQ').value = '';
    S.tab = 'all'; S.sort = 'tot'; S.dir = -1;
    MSREP.fill(); MSUF.fill(); MSANO.fill(); MSMES.fill();
    applyLang(); render();
    if (!SB_ON || AUTH.role === 'gerencia') el('btnSave').hidden = false;
    toast(t().impOk(nd.rows.length, f.name) + (MISSING.length ? t().impOpc(MISSING.join(', ')) : ''));
  } catch(err){
    toast(t().impErr + (err && err.message ? err.message : err), true);
  } finally { btn.disabled = false; e.target.value = ''; }
};

function crc32(u8){
  if (!CRCT){
    CRCT = new Uint32Array(256);
    for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; CRCT[n]=c>>>0; }

  for (let i=0;i<u8.length;i++) c = CRCT[(c^u8[i]) & 0xFF] ^ (c>>>8);

function zipStore(entries){
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  entries.forEach(e=>{
    const name = enc.encode(e.name), data = enc.encode(e.xml), crc = crc32(data);

    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x2100,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true); cd.setUint16(10,0,true); cd.setUint16(12,0,true); cd.setUint16(14,0x2100,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true);
    cd.setUint16(28,name.length,true); cd.setUint32(42,off,true);
    central.push(new Uint8Array(cd.buffer), name);
    off += 30 + name.length + data.length;
  });
  let csize = 0; central.forEach(c=>csize += c.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,entries.length,true); eo.setUint16(10,entries.length,true);
  eo.setUint32(12,csize,true); eo.setUint32(16,off,true);
  const all = parts.concat(central, [new Uint8Array(eo.buffer)]);
  let total = 0; all.forEach(a=>total += a.length);
  const out = new Uint8Array(total); let q = 0;
  all.forEach(a=>{ out.set(a,q); q += a.length; });
  return out;
}
const xe = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colLetter = n => { let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };
const dserial = iso => {
  const a = String(iso).split('-');
  return Math.round((Date.UTC(+a[0],+a[1]-1,+a[2]) - Date.UTC(1899,11,30))/86400000);
};
function sheetXml(rows, widths, extra){
  const cols = widths ? '<cols>'+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>' : '';
  const body = rows.map((r,ri)=>{
    const cells = r.map((c,ci)=>{
      if (c === null || c === undefined || c === '') return '';
      const ref = colLetter(ci)+(ri+1);
      const st = c && c.s !== undefined ? ' s="'+c.s+'"' : '';
      const v = c && c.v !== undefined ? c.v : c;
      if (c && c.d) return '<c r="'+ref+'" s="2"><v>'+dserial(v)+'</v></c>';
      if (typeof v === 'number') return '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'"'+(ri===0?' ht="30" customHeight="1"':'')+'>'+cells+'</row>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0"'+(extra&&extra.nogrid?' showGridLines="0"':'')+'>'
    + (extra&&extra.freeze?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':'')
    + '</sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="14"/>' + cols
    + '<sheetData>'+body+'</sheetData></worksheet>';
}
function modeloXlsx(){

  NOTAS.slice(0,3).forEach(n=>base.push([{v:n, s:3}]));

    [{v:'Modelo de planilha — Relatório de Vendas WGI', s:4}],
    [{v:'Este é o formato que o index.html espera no botão “Importar planilha”. Confira esta lista sempre que a planilha de origem mudar de colunas.', s:3}],
    [],
    ['Coluna (cabeçalho exato)','Obrigatória','Para que o relatório usa','Formato esperado','Exemplo'].map(v=>({v, s:1}))
  ].concat(COLUNAS.map(c=>c.map((v,i)=>({v, s:(i===1?6:5)}))));

  NOTAS.forEach(n=>leia.push([{v:'• '+n, s:0}]));

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
   + '<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>'
   + '<fonts count="5">'
   + '<font><sz val="10"/><name val="Arial"/></font>'

   + '<font><sz val="10"/><name val="Arial"/></font>'
   + '<font><i/><sz val="9"/><color rgb="FF8B858E"/><name val="Arial"/></font>'
   + '<font><b/><sz val="12"/><color rgb="FF7C1B29"/><name val="Arial"/></font>'
   + '</fonts>'
   + '<fills count="3"><fill><patternFill patternType="none"/></fill>'
   + '<fill><patternFill patternType="gray125"/></fill>'
   + '<fill><patternFill patternType="solid"><fgColor rgb="FF7C1B29"/><bgColor indexed="64"/></patternFill></fill></fills>'
   + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
   + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
   + '<cellXfs count="7">'
   + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
   + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
   + '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
   + '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
   + '<xf numFmtId="0" fontId="4" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
   + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'
   + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>'
   + '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  return zipStore([
   {name:'[Content_Types].xml', xml:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
     + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
     + '<Default Extension="xml" ContentType="application/xml"/>'
     + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
     + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
     + '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
     + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
     + '</Types>'},
   {name:'_rels/.rels', xml:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
     + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
     + '</Relationships>'},
   {name:'xl/workbook.xml', xml:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
     + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
     + '<sheets><sheet name="BASE" sheetId="1" r:id="rId1"/><sheet name="LEIA-ME" sheetId="2" r:id="rId2"/></sheets></workbook>'},
   {name:'xl/_rels/workbook.xml.rels', xml:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
     + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
     + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
     + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>'

   {name:'xl/worksheets/sheet2.xml', xml:sheetXml(leia,[30,12,52,52,26],{nogrid:true})}
  ]);
}
el('btnModel').onclick = () => {
  const url = URL.createObjectURL(new Blob([modeloXlsx()],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'MODELO-planilha-relatorio-WGI.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast(t().modelOk);
};

/* ================= salvar os dados importados ================= */
el('btnSave').onclick = async () => {
  const btn = el('btnSave');
  btn.disabled = true;
  try{
    if (SB_ON){
      if (AUTH.role !== 'gerencia') throw new Error(t().soGerencia);
      toast(t().salvando);
      const n = await sbSave();
      toast(t().salvoDb(n));
      btn.hidden = true;
    } else {
      /* modo offline: regrava o proprio HTML com os dados embutidos */
      const src = await (await fetch(location.href, {cache:'no-store'})).text();
      const a = src.indexOf('/*DATA_START*/'), b = src.indexOf('/*DATA_END*/');
      if (a < 0 || b < 0) throw new Error('markers');
      const out = src.slice(0, a) + '/*DATA_START*/const DATA0 = '
        + JSON.stringify(DATA) + ';' + src.slice(b);
      const url = URL.createObjectURL(new Blob([out], {type:'text/html'}));
      const link = document.createElement('a');
      link.href = url; link.download = 'index.html';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast(t().saveOk); btn.hidden = true;
    }
  } catch(err){
    toast((SB_ON ? t().salvoErr : t().saveErr + ' ') + (err && err.message ? err.message : err), true);
  } finally { btn.disabled = false; }
};

/* ================= acesso ================= */
function hash(s){ let x=5381; for (const c of s) x=((x*33)^c.charCodeAt(0))>>>0; return x; }
const KEY = 2519394238;   /* hash da senha de acesso ao painel */

function abrirPainel(){
  el('gate').remove();
  el('app').hidden = false;
  MSREP.fill(); MSUF.fill(); MSANO.fill(); MSMES.fill();
  applyLang(); render();
}
el('gateForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = el('gBtn'), pw = el('gPass');
  set('gErr','');
  if (!SB_ON){
    if (hash(pw.value.trim()) === KEY) abrirPainel();
    else { set('gErr', t().gerr); pw.select(); }
    return;
  }

  btn.disabled = true; set('gBtn', t().entrando);
  try{
    const senha = pw.value.trim();
    const d = await sbLoadData(senha);   /* a senha é conferida no banco */
    SENHA = senha;
    if (d) boot(d);
    applyRole();
    abrirPainel();
    if (!d) toast(t().semDados, true);
    else if (AUTH.role !== 'gerencia' && AUTH.rep) toast(t().repLock(AUTH.rep));
  } catch(err){
    set('gErr', (err && err.message) ? err.message : String(err));
    btn.disabled = false; set('gBtn', t().gbtn); pw.select();
  }
});
el('btnOut').onclick = () => { SENHA = ''; location.reload(); };
el('fLang').addEventListener('click', e=>{ if (e.target.closest('button')) set('gErr',''); });
applyLang();
el('gPass').focus();
</script>
